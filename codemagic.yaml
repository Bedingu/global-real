workflows:
  ios-workflow:
    name: iOS Build & Deploy
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic - Global_Real
    environment:
      groups:
        - appstore_credentials
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: "com.globalreal.app"
        APP_STORE_APPLE_ID: 6761792961
    scripts:
      - name: Fetch signing files
        script: |
          # Usa uma chave privada RSA fixa (env var CERTIFICATE_PRIVATE_KEY,
          # grupo appstore_credentials). Na primeira execucao o Codemagic cria
          # o certificado de distribuicao com essa chave; nos builds seguintes
          # ele reencontra e REUSA o mesmo certificado (nao recria), evitando
          # estourar o limite de 3 certificados da Apple.
          app-store-connect fetch-signing-files com.globalreal.app \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create --type IOS_APP_STORE --platform IOS
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Global Real Testers
