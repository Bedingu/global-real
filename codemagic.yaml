workflows:
  ios-workflow:
    name: iOS Build & Deploy
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic - Global_Real
    environment:
      groups:
        - appstore_credential
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: "com.globalreal.app"
        APP_STORE_APPLE_ID: 6761792961
    scripts:
      - name: Fetch signing files
        script: |
          # A chave privada RSA e fornecida em base64 (env var
          # CERTIFICATE_PRIVATE_KEY, grupo appstore_credential) para evitar
          # quebras de linha ao colar no painel. Aqui decodificamos para PEM.
          echo "$CERTIFICATE_PRIVATE_KEY" | base64 --decode > /tmp/cert_key.pem
          app-store-connect fetch-signing-files com.globalreal.app \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create --type IOS_APP_STORE --platform IOS
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Sem beta_groups: "Global Real Testers" e um grupo INTERNO, que recebe
        # a build automaticamente. Atribuir grupo interno via API falha
        # ("Cannot add internal group to a build"). Para grupos externos,
        # reintroduzir beta_groups com o nome do grupo externo.
